name: Bug report
description: Report a reproducible problem in Command Center
title: "[Bug]: "
labels: [bug, triage]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first. Do not include API keys, vault contents, personal data, private URLs, or unredacted diagnostics. Report vulnerabilities through the private Security Advisory form instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I am using the latest Command Center release.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed credentials and private vault information.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Clearly describe what went wrong.
      placeholder: Command Center does ... when ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Enable ...
        2. Open ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should have happened instead.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain the observed result, including whether data was changed or lost.
    validations:
      required: true
  - type: input
    id: command-center-version
    attributes:
      label: Command Center version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: 1.13.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release assets
        - Manual build from main
        - BRAT
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: If relevant; never include credentials or private endpoint details.
      placeholder: Ollama with model-name, or Not applicable
  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: Did this work in an earlier Command Center release?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant logs, stack traces, screenshots, or configuration after removing sensitive information.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include workarounds and anything else that may help.
  - type: checkboxes
    id: terms
    attributes:
      label: Community standards
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
